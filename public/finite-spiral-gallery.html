<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finite Spiral Scroll Experience | ArtGala</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel for Standalone Execution -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    body {
      background-color: #07070a;
      color: #f5f5f5;
      margin: 0;
      overflow-x: hidden;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .font-mono-tech {
      font-family: 'Space Grotesk', monospace;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Curated 6 projects matching projects.js
    const projectImages = [
      {
        id: 'p1',
        title: 'Lumina AI',
        tag: 'Next.js',
        src: 'https://images.unsplash.com/photo-1620712943543-bcc4688e7485?auto=format&fit=crop&w=800&q=80',
        alt: 'Lumina AI - Next-gen LLM Streaming'
      },
      {
        id: 'p2',
        title: 'Nexus Platform',
        tag: 'React',
        src: 'https://images.unsplash.com/photo-1639762681485-074b7f938ba0?auto=format&fit=crop&w=800&q=80',
        alt: 'Nexus Platform - Multi-chain Asset Tracking'
      },
      {
        id: 'p3',
        title: 'Orbit Engine',
        tag: 'Three.js',
        src: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80',
        alt: 'Orbit Engine - 3D WebGL Shader Pipeline'
      },
      {
        id: 'p4',
        title: 'SwiftPay',
        tag: 'Flutter',
        src: 'https://images.unsplash.com/photo-1559526324-4b87b5e36e44?auto=format&fit=crop&w=800&q=80',
        alt: 'SwiftPay - Cross-platform Mobile Wallet'
      },
      {
        id: 'p5',
        title: 'Zenith CRM',
        tag: 'Turborepo',
        src: 'https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=800&q=80',
        alt: 'Zenith CRM - Enterprise Analytics'
      },
      {
        id: 'p6',
        title: 'Aura Workspace',
        tag: 'Creative UI',
        src: 'https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?auto=format&fit=crop&w=800&q=80',
        alt: 'Aura Workspace - Infinite Collaborative Canvas'
      }
    ];

    const clamp = (val, min, max) => Math.min(Math.max(val, min), max);

    function FiniteSpiralGallery({ items = projectImages }) {
      const trackRef = useRef(null);
      const viewportRef = useRef(null);
      const cardRefs = useRef([]);
      const textRef = useRef(null);
      const backdropRef = useRef(null);
      const hudProgressRef = useRef(null);
      const activeCardRef = useRef(null);

      // Base 3D spiral configuration
      const baseRadius = 240;
      const baseCardWidth = 260;
      const baseCardHeight = 175;
      const baseVerticalSpacing = 115;
      const basePerspective = 950;
      const cardsPerTurn = 5.6;
      const centerScale = 1.32;
      const cardTilt = 3.5;

      useEffect(() => {
        let frameId;
        const count = items.length;

        const render = () => {
          if (!trackRef.current || !viewportRef.current) return;

          const rect = trackRef.current.getBoundingClientRect();
          const viewWidth = window.innerWidth;
          const viewHeight = window.innerHeight;
          const totalDist = rect.height - viewHeight;
          const scrolled = -rect.top;

          // Normalized track progress strictly from 0 to 1
          const progress = clamp(scrolled / (totalDist || 1), 0, 1);

          // Responsive viewport fit calculation
          const fit = Math.min(1, Math.max(0.55, viewWidth / (baseCardWidth * 3.2)), Math.max(0.6, viewHeight / (baseCardHeight * 3.4)));
          const responsiveRadius = baseRadius * fit;
          const responsiveSpacing = baseVerticalSpacing * fit;
          const responsiveCardW = baseCardWidth * fit;
          const responsiveCardH = baseCardHeight * fit;

          // Phase 1 (0.00 to 0.75): Finite spiral traversal
          // Start with card 0 entering from the bottom (offset ~ +0.85) then reaching center
          const spiralProgress = clamp(progress / 0.75, 0, 1);
          const startCenterCard = -0.85; // Card 0 starts below center viewport
          const endCenterCard = count - 1; // Card 5 reaches exact center focus at 0.75
          const currentCenterCard = startCenterCard + spiralProgress * (endCenterCard - startCenterCard);

          // Phase 2 (0.75 to 1.00): Camera zoom wipe & text presentation
          const zoomProgress = clamp((progress - 0.75) / 0.25, 0, 1);

          // Update HUD
          if (hudProgressRef.current) {
            hudProgressRef.current.innerText = `${Math.round(progress * 100)}%`;
          }
          if (activeCardRef.current) {
            const currentIdx = clamp(Math.round(currentCenterCard), 0, count - 1);
            activeCardRef.current.innerText = `${currentIdx + 1} / ${count} • ${items[currentIdx]?.title || ''}`;
          }

          items.forEach((_, index) => {
            const card = cardRefs.current[index];
            if (!card) return;

            const isLast = index === count - 1;

            if (isLast && zoomProgress > 0) {
              // Final card: zooms smoothly forward toward camera and covers viewport
              // Using power curve for dramatic cinema zoom
              const zoomFactor = Math.pow(zoomProgress, 1.35);
              const zoomScale = centerScale * fit + zoomFactor * 22;
              const zTravel = zoomFactor * 780;

              // Fade card out once fully zoomed to reveal pure dark canvas & typography
              const wipeFade = clamp(1 - (zoomProgress - 0.58) / 0.32, 0, 1);
              const cardRadius = clamp(16 * (1 - zoomProgress * 2.5), 0, 16);

              card.style.transform = `translate(-50%, -50%) translate3d(0px, 0px, ${zTravel}px) scale(${zoomScale})`;
              card.style.opacity = wipeFade.toFixed(3);
              card.style.zIndex = '999';
              card.style.filter = 'none';
              card.style.borderRadius = `${cardRadius}px`;
              card.style.boxShadow = `0 0 ${40 * (1 - zoomProgress)}px rgba(0,0,0,0.8)`;
            } else {
              // Spiral helical positioning
              const offset = index - currentCenterCard;
              const angle = offset * (360 / cardsPerTurn);
              const angleRad = (angle * Math.PI) / 180;

              const x = Math.sin(angleRad) * responsiveRadius;
              const z = Math.cos(angleRad) * responsiveRadius;
              const y = offset * responsiveSpacing;

              const dist = Math.abs(offset);
              const focus = clamp(1 - dist / 2.2, 0, 1);
              const scale = (1 + (centerScale - 1) * focus) * fit;

              // Smooth depth of field blur & opacity falloff
              const opacity = clamp(1 - (dist - 1.1) / 1.7, 0, 1);
              const blur = clamp((dist - 0.85) * 4.5, 0, 10);
              const depth = (z / responsiveRadius + 1) / 2;

              // Smoothly fade out earlier cards as zoom begins
              const hideDuringZoom = isLast ? 1 : clamp(1 - zoomProgress * 3.5, 0, 1);
              const finalOpacity = (opacity * hideDuringZoom).toFixed(3);

              card.style.transform = `translate(-50%, -50%) translate3d(${x}px, ${y}px, ${z}px) scale(${scale})`;
              card.style.opacity = finalOpacity;
              card.style.filter = blur > 0.05 ? `blur(${blur.toFixed(1)}px)` : 'none';
              card.style.zIndex = String(Math.round(depth * 1000) + index);
              card.style.borderRadius = '14px';
              card.style.pointerEvents = opacity > 0.4 && hideDuringZoom > 0.5 ? 'auto' : 'none';
            }
          });

          // Phase 2: Backdrop wipe & Typography Quote Reveal
          if (textRef.current && backdropRef.current) {
            // Dark blackout layer fades in behind the expanding card
            const backdropOpacity = clamp((zoomProgress - 0.05) / 0.45, 0, 1);
            backdropRef.current.style.opacity = backdropOpacity.toFixed(3);

            // Quote text reveal timing (~0.80 to 1.00)
            const textStart = 0.80;
            const textProgress = clamp((progress - textStart) / (1 - textStart), 0, 1);
            const textY = (1 - textProgress) * 35;

            textRef.current.style.opacity = textProgress.toFixed(3);
            textRef.current.style.transform = `translateY(${textY}px)`;
            textRef.current.style.pointerEvents = textProgress > 0.5 ? 'auto' : 'none';
          }
        };

        const onFrame = () => {
          render();
          frameId = requestAnimationFrame(onFrame);
        };
        frameId = requestAnimationFrame(onFrame);

        return () => cancelAnimationFrame(frameId);
      }, [items]);

      return (
        <div ref={trackRef} className="relative w-full h-[520vh] bg-[#07070a]">
          {/* Sticky 3D Screen Viewport */}
          <div
            ref={viewportRef}
            className="sticky top-0 h-screen w-full overflow-hidden flex items-center justify-center select-none"
          >
            {/* Subtle atmospheric ambient glow */}
            <div className="absolute inset-0 pointer-events-none z-0">
              <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[650px] h-[650px] bg-red-600/10 rounded-full blur-[140px]" />
              <div className="absolute bottom-12 right-12 w-[450px] h-[450px] bg-indigo-600/10 rounded-full blur-[130px]" />
              <div className="absolute inset-0 bg-[linear-gradient(to_right,#ffffff04_1px,transparent_1px),linear-gradient(to_bottom,#ffffff04_1px,transparent_1px)] bg-[size:4rem_4rem] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_50%,#000_70%,transparent_100%)]" />
            </div>

            {/* 3D Spiral Stage */}
            <div
              className="relative w-full h-full [transform-style:preserve-3d] flex items-center justify-center pointer-events-none"
              style={{ perspective: `${basePerspective}px` }}
            >
              {items.map((item, index) => (
                <div
                  key={item.id}
                  ref={el => (cardRefs.current[index] = el)}
                  className="group absolute left-1/2 top-1/2 overflow-hidden border border-white/20 shadow-2xl bg-zinc-950 will-change-transform cursor-pointer"
                  style={{
                    width: `${baseCardWidth}px`,
                    height: `${baseCardHeight}px`,
                    borderRadius: '14px',
                  }}
                >
                  <img
                    src={item.src}
                    alt={item.alt}
                    className="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
                    draggable={false}
                  />
                  {/* Glass highlight border */}
                  <div className="absolute inset-0 border border-white/15 rounded-[14px] pointer-events-none" />
                </div>
              ))}
            </div>

            {/* Blackout Wipe Layer */}
            <div
              ref={backdropRef}
              className="absolute inset-0 bg-[#07070a] pointer-events-none opacity-0 z-40 transition-opacity"
            />
          </div>
        </div>
      );
    }

    function App() {
      return (
        <div className="bg-[#07070a] min-h-screen text-white">
          {/* Header Introduction */}
          <header className="h-[75vh] flex flex-col items-center justify-center text-center px-4 bg-gradient-to-b from-[#121218] via-[#0b0b0f] to-[#07070a] relative border-b border-white/5">
            <span className="text-xs uppercase tracking-widest text-red-400 mb-3 font-mono-tech px-3 py-1 rounded-full bg-red-950/40 border border-red-500/20">
              Interactive Dimension
            </span>
            <h2 className="text-4xl md:text-7xl font-bold tracking-tight text-white mb-4">
              Curated Masterworks
            </h2>
            <p className="text-zinc-400 text-sm md:text-base max-w-md font-light leading-relaxed">
              Scroll down to step through the finite 3D spiral into the cinematic camera wipe.
            </p>
            <div className="mt-8 flex items-center gap-2 text-xs font-mono-tech text-zinc-500">
              <span>↓ Scroll to initiate sequence</span>
            </div>
          </header>

          {/* Finite Spiral Gallery with Camera Wipe Transition */}
          <FiniteSpiralGallery />

          {/* Next Page / Subsequent Section */}
          <section id="case-studies" className="min-h-screen bg-[#07070a] border-t border-zinc-900 px-8 py-24 flex flex-col items-center justify-center text-center">
            <span className="text-xs uppercase tracking-widest text-red-400 mb-4 font-mono-tech">
              Next Dimension
            </span>
            <h3 className="text-3xl md:text-5xl font-semibold text-white mb-6">
              Case Studies & Technical Depth
            </h3>
            <p className="text-zinc-400 max-w-lg leading-relaxed text-sm md:text-base font-light mb-8">
              Seamlessly navigated past the spiral narrative into detailed architecture breakdowns and live deployments.
            </p>
            <a
              href="#"
              className="px-8 py-3 rounded-full bg-red-600 hover:bg-red-500 text-white text-sm font-medium transition-all shadow-[0_0_24px_rgba(230,0,38,0.5)]"
            >
              Explore Full Engineering Specs
            </a>
          </section>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
